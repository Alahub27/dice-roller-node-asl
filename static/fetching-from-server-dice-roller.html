<!DOCTYPE html>

<html>
<head>
    <meta charset="utf-8">
    <title>Dice Roller Server API Testing</title>
</head>

<body>

<h1>Dice Roller Node.js Server APIs</h1>

<p>
    This page tests the RESTful APIs provided by the Node.js Dice Roller server.
</p>

<!-- Wake-up API -->

<h2>Wake Up API</h2>

<button type="button" onclick="wakeUpServer()">
    Wake Up Server
</button>

<div id="wakeup-result"></div>

<br><br>

<!-- Version API -->

<h2>Version API</h2>

<button type="button" onclick="fetchVersion()">
    Fetch Version
</button>

<div id="version-result"></div>

<br><br>

<!-- Ping API -->

<h2>Ping API</h2>

<button type="button" onclick="fetchPing()">
    Ping Server
</button>

<div id="ping-result"></div>

<br><br>

<!-- Dice Roller API -->

<h2>Roll Dice API</h2>

<label for="dice-sides">Number of sides:</label>

<select id="dice-sides">
    <option value="4">D4</option>
    <option value="6" selected>D6</option>
    <option value="8">D8</option>
    <option value="10">D10</option>
    <option value="12">D12</option>
    <option value="20">D20</option>
</select>

<button type="button" onclick="rollDice()">
    Roll Dice
</button>

<div id="dice-result"></div>

<script>

    // ----------------------------------------
    // Wake-up API
    // ----------------------------------------

    async function wakeUpServer() {

        const response =
            await fetch("/api/wakeup");

        const data =
            await response.json();

        document.getElementById("wakeup-result").innerHTML =
            data.status + ": " + data.message;
    }


    // ----------------------------------------
    // Version API
    // ----------------------------------------

    async function fetchVersion() {

        const response =
            await fetch("/version");

        const responseText =
            await response.text();

        document.getElementById("version-result").innerHTML =
            responseText;
    }


    // ----------------------------------------
    // Ping API
    // ----------------------------------------

    async function fetchPing() {

        const response =
            await fetch("/api/ping");

        const responseText =
            await response.text();

        document.getElementById("ping-result").innerHTML =
            responseText;
    }


    // ----------------------------------------
    // Dice Roller API
    // ----------------------------------------

    async function rollDice() {

        const sides =
            document.getElementById("dice-sides").value;

        const response =
            await fetch("/api/roll/" + sides);

        const data =
            await response.json();

        document.getElementById("dice-result").innerHTML =
            "You rolled a " + data.roll +
            " on a D" + data.sides + ".";
    }

</script>

</body>
</html>
